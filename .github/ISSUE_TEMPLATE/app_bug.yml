name: Report a bug or regression for an app
description: If an app runs at least partly in Podroid and has a problem, or used to work and no longer does, choose this option.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for reporting a problem with an app that runs at least
        partly in Podroid. Podroid only runs 32-bit (armv6/armv7) apps, so
        64-bit-only apps can't work. Please don't attach IPA files or link to
        them.
  - type: input
    attributes:
      label: App name
      placeholder: Super Monkey Ball
    validations:
      required: true
  - type: input
    attributes:
      label: App version
      placeholder: '1.0'
    validations:
      required: true
  - type: input
    attributes:
      label: Podroid version
      description: This is shown at the bottom of the app list.
      placeholder: 'v0.3.27'
    validations:
      required: true
  - type: input
    attributes:
      label: Phone model
      placeholder: Samsung Galaxy S10e
    validations:
      required: true
  - type: input
    attributes:
      label: Android version and GPU
      placeholder: Android 12, Adreno 640
    validations:
      required: true
  - type: textarea
    attributes:
      label: What is the problem with the app?
    validations:
      required: true
  - type: textarea
    attributes:
      label: If Podroid crashed, please paste the log output.
      description: |
        This is the Podroid_log.txt file. After a crash, the app list also has
        a banner for viewing the log.
      render: 'text'
  - type: checkboxes
    attributes:
      label: By submitting this issue, I certify that…
      options:
        - label: I have tested this with the latest Podroid release.
          required: true
        - label: I understand that linking to, discussing or asking for pirated content is not permitted, and will lead to an immediate ban.
          required: true
        - label: I understand that “Abandonware” and illegal copies of free games are also pirated content.
          required: true
